# ─────────────────────────────────────────────────────────────────────────────
# refresh_upstox_token.yml
# Runs daily at 07:30 IST (02:00 UTC) — before market open.
# Refreshes Upstox access token and updates GitHub + Streamlit secrets.
# ─────────────────────────────────────────────────────────────────────────────

name: Refresh Upstox Token

on:
  schedule:
    - cron: "0 2 * * *"        # 02:00 UTC = 07:30 IST daily
  workflow_dispatch:            # allow manual trigger from GitHub UI

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pynacl

      - name: Refresh Upstox token
        env:
          UPSTOX_API_KEY:       ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_API_SECRET:    ${{ secrets.UPSTOX_API_SECRET }}
          UPSTOX_REDIRECT_URI:  ${{ secrets.UPSTOX_REDIRECT_URI }}
          UPSTOX_REFRESH_TOKEN: ${{ secrets.UPSTOX_REFRESH_TOKEN }}
          UPSTOX_TOKEN:         ${{ secrets.UPSTOX_TOKEN }}
          UPSTOX_TOKEN_EXPIRY:  ${{ secrets.UPSTOX_TOKEN_EXPIRY }}
          GITHUB_TOKEN:         ${{ secrets.PAT_TOKEN }}   # Personal Access Token with secrets:write
          GITHUB_REPO:          ${{ github.repository }}
        run: |
          cd $GITHUB_WORKSPACE
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          from src.upstox_auth import refresh_and_update_github_secret
          refresh_and_update_github_secret()
          "

      - name: Update Streamlit secrets via API
        env:
          STREAMLIT_APP_ID:     ${{ secrets.STREAMLIT_APP_ID }}
          STREAMLIT_API_TOKEN:  ${{ secrets.STREAMLIT_API_TOKEN }}
          UPSTOX_API_KEY:       ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_API_SECRET:    ${{ secrets.UPSTOX_API_SECRET }}
          UPSTOX_REDIRECT_URI:  ${{ secrets.UPSTOX_REDIRECT_URI }}
          UPSTOX_REFRESH_TOKEN: ${{ secrets.UPSTOX_REFRESH_TOKEN }}
          UPSTOX_TOKEN:         ${{ secrets.UPSTOX_TOKEN }}
          UPSTOX_TOKEN_EXPIRY:  ${{ secrets.UPSTOX_TOKEN_EXPIRY }}
        run: |
          echo "✅ Token refresh complete. GitHub secrets updated."
          echo "Note: Streamlit Cloud picks up secret changes on next app reboot."
