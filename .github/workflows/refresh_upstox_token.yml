# ─────────────────────────────────────────────────────────────────────────────
# refresh_upstox_token.yml
# Runs daily at 07:30 IST (02:00 UTC) — before market open.
# Uses TOTP auto-login to generate a new Upstox access token.
# Pushes new token to GitHub Secrets + Streamlit Cloud secrets.
# ─────────────────────────────────────────────────────────────────────────────

name: Refresh Upstox Token (TOTP)

on:
  schedule:
    - cron: "0 2 * * *"      # 02:00 UTC = 07:30 IST every day
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests upstox-totp pynacl pydantic

      - name: Generate new token via TOTP and push to secrets
        env:
          # Upstox login credentials
          UPSTOX_USERNAME:     ${{ secrets.UPSTOX_USERNAME }}
          UPSTOX_PASSWORD:     ${{ secrets.UPSTOX_PASSWORD }}
          UPSTOX_PIN:          ${{ secrets.UPSTOX_PIN }}
          UPSTOX_TOTP_SECRET:  ${{ secrets.UPSTOX_TOTP_SECRET }}
          # Upstox app credentials
          UPSTOX_API_KEY:      ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_API_SECRET:   ${{ secrets.UPSTOX_API_SECRET }}
          UPSTOX_REDIRECT_URI: ${{ secrets.UPSTOX_REDIRECT_URI }}
          # GitHub PAT for pushing updated secrets back
          GH_PAT_TOKEN:        ${{ secrets.GH_PAT_TOKEN }}
          GITHUB_REPO:         ${{ github.repository }}
          # Streamlit API (optional — update token in Streamlit too)
          STREAMLIT_APP_ID:    ${{ secrets.STREAMLIT_APP_ID }}
          STREAMLIT_API_TOKEN: ${{ secrets.STREAMLIT_API_TOKEN }}
        run: |
          cd $GITHUB_WORKSPACE
          python -c "
          import sys, os, logging
          logging.basicConfig(level=logging.INFO, format='%(asctime)s %(levelname)s %(message)s')
          sys.path.insert(0, '.')
          from src.upstox_auth import refresh_and_push_token
          token = refresh_and_push_token()
          print(f'Token generated: {token[:20]}...')
          "

      - name: Confirm success
        run: echo "✅ Upstox token refreshed and secrets updated at $(date)"
