name: Refresh Upstox Token (TOTP)

on:
  schedule:
    - cron: "0 2 * * *"    # 02:00 UTC = 07:30 IST daily
  workflow_dispatch:        # Manual trigger from GitHub UI

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests upstox-totp pynacl pydantic

      - name: Generate new token via TOTP and push to secrets
        env:
          UPSTOX_USERNAME:     ${{ secrets.UPSTOX_USERNAME }}
          UPSTOX_PASSWORD:     ${{ secrets.UPSTOX_PASSWORD }}
          UPSTOX_PIN:          ${{ secrets.UPSTOX_PIN }}
          UPSTOX_TOTP_SECRET:  ${{ secrets.UPSTOX_TOTP_SECRET }}
          UPSTOX_API_KEY:      ${{ secrets.UPSTOX_API_KEY }}
          UPSTOX_API_SECRET:   ${{ secrets.UPSTOX_API_SECRET }}
          UPSTOX_REDIRECT_URI: ${{ secrets.UPSTOX_REDIRECT_URI }}
          GH_PAT_TOKEN:        ${{ secrets.GH_PAT_TOKEN }}
          GITHUB_REPO:         ${{ github.repository }}
          # Streamlit secrets are self-refreshed by the dashboard via TOTP
          # No Streamlit API needed
        run: |
          python -c "
          import sys, logging
          logging.basicConfig(level=logging.INFO, format='%(asctime)s %(levelname)s %(message)s')
          sys.path.insert(0, '.')
          from src.upstox_auth import refresh_and_push_token
          token = refresh_and_push_token()
          print(f'Token generated: {token[:20]}...')
          "

      - name: Confirm success
        run: echo "Upstox token refreshed at $(date +'%Y-%m-%d %H:%M UTC')"
      - name: Push token to SIP Orchestrator repo
        env:
          ORCHESTRATOR_REPO_PAT: ${{ secrets.ORCHESTRATOR_REPO_PAT }}
          ORCHESTRATOR_OWNER:    shubhamshivhare27
          ORCHESTRATOR_REPO:     sip_orchestrator
        run: |
          python -c "
          import json, os, sys
          sys.path.insert(0, '.')
          cache = json.load(open('data/upstox_token.json'))
          token = cache['access_token']
          expiry = cache.get('expires_at', '')
          os.environ['UPSTOX_TOKEN'] = token
          if expiry:
              os.environ['UPSTOX_TOKEN_EXPIRY'] = expiry
          from src.push_upstox_token import push
          owner = os.environ['ORCHESTRATOR_OWNER']
          repo = os.environ['ORCHESTRATOR_REPO']
          pat = os.environ['ORCHESTRATOR_REPO_PAT']
          push(owner, repo, 'UPSTOX_TOKEN', token, pat)
          if expiry:
              push(owner, repo, 'UPSTOX_TOKEN_EXPIRY', expiry, pat)
          print(f'Pushed fresh token (expires {expiry}) to {owner}/{repo}')
          "
