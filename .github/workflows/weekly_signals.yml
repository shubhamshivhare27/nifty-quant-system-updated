name: Weekly Signal Run

on:
  schedule:
    # Every Friday at 3:30 PM UTC = 9:00 PM IST
    - cron: '30 15 * * 5'
  workflow_dispatch:    # allows manual trigger from GitHub UI

jobs:
  run-weekly-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly signal pipeline
        env:
          UPSTOX_TOKEN:               ${{ secrets.UPSTOX_TOKEN }}
          UPSTOX_API_KEY:             ${{ secrets.UPSTOX_API_KEY }}
          GMAIL_USER:                 ${{ secrets.GMAIL_USER }}
          GMAIL_PASS:                 ${{ secrets.GMAIL_PASS }}
          RECIPIENT_EMAIL:            ${{ secrets.RECIPIENT_EMAIL }}
          GOOGLE_SHEETS_CREDENTIALS:  ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: python live_signals_weekly.py

      - name: Commit updated data files
        run: |
          git config --global user.name  "Nifty Signal Bot"
          git config --global user.email "bot@nifty-signals.local"
          git add data/ signals/
          git diff --cached --quiet || git commit -m "🤖 Weekly signals — $(date +'%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

